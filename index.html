<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

:root{
--bg:#0f172a;
--card:#1e293b;
--border:#334155;
--text:#f8fafc;
--accent:#3b82f6;
}

body.light{
--bg:#f8fafc;
--card:#ffffff;
--border:#d1d5db;
--text:#111827;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 20px;
background:var(--card);
border-bottom:1px solid var(--border);
flex-wrap:wrap;
gap:10px;
}

#projectName{
background:transparent;
border:none;
outline:none;
color:var(--text);
font-size:18px;
font-weight:700;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--accent);
color:white;
font-weight:600;
}

.workspace{
height:calc(100vh - 70px);
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

.editors{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.panel{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:10px;
}

.panel h3{
margin-bottom:10px;
}
