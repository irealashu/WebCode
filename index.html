<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCode - Universal IDE</title>
  <meta name="description" content="Universal in-browser IDE with multi-language runtimes (Web HTML/CSS/JS, Python 3 Pyodide, SQL Engine, Markdown), multi-file explorer, CodeMirror editor, interactive terminal, command palette, DevTools, and export.">
  <meta property="og:title" content="WebCode - Universal IDE">
  <meta property="og:description" content="Universal in-browser IDE with multi-language runtimes (Web HTML/CSS/JS, Python 3 Pyodide, SQL Engine, Markdown), multi-file explorer, CodeMirror editor, interactive terminal, command palette, DevTools, and export.">

  <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CodeMirror 5 Core & Modes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-ocean.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gfm/gfm.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <!-- JSZip for project archives -->
  <script src="./jszip.min.js"></script>

  <!-- Application CSS -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="theme-midnight">

  <!-- IDE Topbar -->
  <header class="app-header" id="appHeader">
    <div class="brand-wrapper">
      <div class="brand-icon" id="brandLogo">⚡</div>
      <span class="brand-name">WebCode</span>
      <input type="text" id="projectTitle" class="project-title-input" value="💻 My Project" title="Project Name">
      <span class="runtime-badge" id="runtimeBadge">Web Engine</span>
    </div>

    <div class="topbar-center">
      <button class="btn btn-primary" id="btnRunCode" onclick="runActiveFile()">
        <span>▶</span>
        <span data-i18n="run">Run</span>
      </button>

      <button class="btn" id="btnSaveSnapshot" onclick="saveProjectSnapshot()">
        <span>💾</span>
        <span data-i18n="save">Save</span>
      </button>

      <button class="btn" id="btnOpenTemplates" onclick="openTemplatesModal()">
        <span>📋</span>
        <span data-i18n="templates">Templates</span>
      </button>

      <button class="btn" id="btnCommandPalette" onclick="toggleCommandPalette()" title="Command Palette (Ctrl+Shift+P)">
        <span>⌨️</span>
        <span data-i18n="commandPalette">Commands</span>
      </button>
    </div>

    <div class="topbar-actions">
      <!-- Layout Switcher -->
      <div class="btn-group" id="layoutGroup">
        <button class="btn-tab active" data-layout="split" onclick="setIdeLayout('split')" title="Split View">◫</button>
        <button class="btn-tab" data-layout="code-only" onclick="setIdeLayout('code-only')" title="Code Only">▯</button>
        <button class="btn-tab" data-layout="preview-only" onclick="setIdeLayout('preview-only')" title="Output Only">▭</button>
      </div>

      <!-- Export & Share -->
      <button class="btn btn-sm" id="btnExportZip" onclick="exportProjectZip()" title="Export ZIP Archive">
        <span>📦</span>
        <span data-i18n="exportZip">ZIP</span>
      </button>

      <button class="btn btn-sm" id="btnShareLink" onclick="copyShareUrl()" title="Share Link">
        <span>🔗</span>
      </button>

      <!-- Language Switcher (10 languages) -->
      <select class="custom-select" id="langSelector" onchange="setIdeLanguage(this.value)">
        <option value="en">🇺🇸 EN</option>
        <option value="es">🇪🇸 ES</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="pt">🇧🇷 PT</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>

      <!-- Theme Switcher -->
      <select class="custom-select" id="themeSelector" onchange="setIdeTheme(this.value)">
        <option value="midnight">🌙 Midnight</option>
        <option value="light">☀️ Light</option>
        <option value="dracula">🧛 Dracula</option>
        <option value="monokai">🎨 Monokai</option>
      </select>
    </div>
  </header>

  <!-- IDE Main Body -->
  <main class="ide-body" id="ideBody">

    <!-- Activity Bar (VS Code Style Left Column) -->
    <nav class="activity-bar" id="activityBar" aria-label="Activity Bar">
      <div class="activity-icons-top">
        <button class="activity-btn active" data-view="explorer" onclick="switchSidebarView('explorer')" title="Files Explorer" id="activityExplorerBtn">
          📁
        </button>
        <button class="activity-btn" data-view="search" onclick="switchSidebarView('search')" title="Search in Files" id="activitySearchBtn">
          🔍
        </button>
        <button class="activity-btn" data-view="packages" onclick="switchSidebarView('packages')" title="Packages & CDNs" id="activityPackagesBtn">
          📦
        </button>
        <button class="activity-btn" data-view="tools" onclick="switchSidebarView('tools')" title="Developer Toolbox" id="activityToolsBtn">
          🛠️
        </button>
        <button class="activity-btn" data-view="history" onclick="switchSidebarView('history')" title="Snapshots & History" id="activityHistoryBtn">
          🕒
        </button>
      </div>
      <div class="activity-icons-bottom">
        <button class="activity-btn" data-view="settings" onclick="switchSidebarView('settings')" title="IDE Settings" id="activitySettingsBtn">
          ⚙️
        </button>
      </div>
    </nav>

    <!-- Sidebar Panel (Drawer for Explorer / Tools / CDNs) -->
    <aside class="sidebar-panel" id="sidebarPanel" data-current-view="explorer">
      <div class="sidebar-header" id="sidebarHeader">
        <span id="sidebarHeaderTitle" data-i18n="filesTitle">PROJECT FILES</span>
        <div class="file-tree-actions">
          <button class="tree-action-btn" onclick="promptCreateNewFile()" title="New File" id="btnNewFileTree">＋</button>
        </div>
      </div>
      <div class="sidebar-content" id="sidebarContentArea">
        <div class="file-list" id="fileTreeList"></div>
      </div>
    </aside>

    <!-- Center Workspace Stage (Editor + Preview/Result + Bottom Panel) -->
    <section class="workspace-stage" id="workspaceStage">

      <!-- Editor & Preview Split Container -->
      <div class="editor-and-preview-container" id="editorAndPreviewContainer">

        <!-- Code Editor Pane -->
        <div class="editor-pane" id="editorPane">
          <!-- Open Tabs Bar -->
          <div class="editor-tabs-bar" id="editorTabsBar"></div>

          <!-- File Breadcrumb & Info -->
          <div class="editor-breadcrumb" id="editorBreadcrumb">
            <span id="activeFileBreadcrumb">index.html</span>
            <span id="editorStats">HTML | Ln 1, Col 1 | 0 lines</span>
          </div>

          <!-- CodeMirror Mounting Node -->
          <div class="codemirror-wrapper" id="codeMirrorContainer"></div>
        </div>

        <!-- Preview / Result Output Pane -->
        <div class="preview-pane" id="previewPane">
          <div class="preview-header" id="previewHeader">
            <span data-i18n="livePreview">Live Output</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="btn btn-sm btn-tab active" onclick="setDevicePreview('desktop', this)" title="Desktop View">🖥️</button>
              <button class="btn btn-sm btn-tab" onclick="setDevicePreview('tablet', this)" title="Tablet View">📱</button>
              <button class="btn btn-sm btn-tab" onclick="setDevicePreview('mobile', this)" title="Mobile View">📲</button>
              <button class="btn btn-sm" onclick="runActiveFile()" title="Refresh">🔄</button>
            </div>
          </div>

          <div class="preview-viewport" id="previewViewport">
            <!-- Web Live Sandbox Iframe -->
            <iframe id="previewFrame" class="preview-iframe" title="WebCode Preview" sandbox="allow-scripts allow-modals allow-same-origin allow-forms"></iframe>

            <!-- Markdown Document Renderer -->
            <div id="markdownContainer" class="markdown-view" style="display:none;"></div>

            <!-- SQL Relational Results Viewer -->
            <div id="sqlContainer" class="sql-table-view" style="display:none;"></div>
          </div>
        </div>

      </div>

      <!-- Bottom Panel (Console / Terminal / Output / REPL) -->
      <section class="bottom-panel" id="bottomPanel">
        <div class="bottom-panel-header" id="bottomPanelHeader">
          <div class="panel-tabs">
            <button class="panel-tab-btn active" data-tab="terminal" onclick="switchBottomTab('terminal')" id="tabTerminalBtn">
              <span>💻</span> <span data-i18n="terminal">Terminal</span>
            </button>
            <button class="panel-tab-btn" data-tab="sqlViewer" onclick="switchBottomTab('sqlViewer')" id="tabSqlViewerBtn">
              <span>📊</span> <span data-i18n="sqlViewer">SQL Results</span>
            </button>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="btn btn-sm" onclick="clearTerminal()" id="btnClearTerminal">
              <span data-i18n="clearLogs">Clear</span>
            </button>
            <button class="btn btn-sm" onclick="toggleBottomPanel()" id="btnToggleBottomPanel">↕</button>
          </div>
        </div>

        <div class="terminal-stream" id="terminalLogs"></div>

        <div class="terminal-repl" id="terminalRepl">
          <span style="color:var(--accent);font-weight:bold;">❯</span>
          <input type="text" id="termReplInput" placeholder="Type JS expression or Python command..." data-i18n-placeholder="evalPrompt">
        </div>
      </section>

    </section>

  </main>

  <!-- Command Palette Modal (Ctrl+Shift+P) -->
  <div class="command-palette-backdrop" id="commandPaletteModal" onclick="if(event.target === this) toggleCommandPalette()">
    <div class="command-palette-box">
      <input type="text" id="commandSearchInput" class="command-search-input" placeholder="Type a command or search..." oninput="renderCommandList(this.value)">
      <div class="command-list" id="commandList"></div>
    </div>
  </div>

  <!-- Templates Modal -->
  <div class="modal-backdrop" id="templatesModal" onclick="if(event.target === this) closeModal('templatesModal')">
    <div class="modal-box">
      <div class="modal-header">
        <span data-i18n="templates">Project Templates</span>
        <button class="tree-action-btn" onclick="closeModal('templatesModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="templates-container" id="templatesGrid"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('templatesModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    function setDevicePreview(device, el) {
      const frame = document.getElementById('previewFrame');
      frame.className = `preview-iframe device-${device}`;
      el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
  </script>

  <!-- Main Application Controller -->
  <script src="./app.js"></script>
</body>
</html>
