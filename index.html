<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💻 WebCode</title>

<script src="./jszip.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}
    
textarea:focus,
button:focus,
input:focus{
    outline:2px solid var(--accent);
    outline-offset:2px;
}

label{
    cursor:pointer;
}
    
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --border:#334155;
    --text:#f8fafc;
    --accent:#3b82f6;
    --danger:#ef4444;
}

body.light{
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#d1d5db;
    --text:#111827;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:12px 20px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
}

#projectName{
    border:none;
    background:transparent;
    color:var(--text);
    font-size:18px;
    font-weight:700;
    outline:none;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
}

button{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    background:var(--accent);
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.workspace{
    height:calc(100vh - 70px);
    overflow:auto;
    padding:10px;
}

.editors{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
}

.panel h3{
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:350px;
    resize:vertical;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-family:Consolas, monospace;
}

.preview-panel{
    margin-top:10px;
}

iframe{
    width:100%;
    height:500px;
    border:none;
    border-radius:8px;
    background:#fff;
}

.stats{
    font-size:13px;
    opacity:.8;
    margin-top:10px;
}

.history{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.history button{
    background:#475569;
}

.status{
    font-size:12px;
    margin-left:5px;
    opacity:.8;
}

@media(max-width:1000px){

    .editors{
        grid-template-columns:1fr;
    }

    textarea{
        height:240px;
    }

    iframe{
        height:380px;
    }
}
</style>
</head>
<body>

<div class="topbar">

<input
id="projectName"
type="text"
value="💻 WebCode">

<div class="actions">

<label>
<input
id="autorun"
type="checkbox"
checked>
Auto Run
</label>

<button onclick="runCode()">▶ Run</button>
<button onclick="saveProject()">💾 Save</button>
<button onclick="exportProject()">📦 Export ZIP</button>
<button onclick="importFiles()">📥 Import</button>
<button id="themeBtn">🌙 Light</button>
<button onclick="fullscreenPreview()">⛶ Fullscreen</button>

<span id="saveStatus" class="status"></span>

</div>

</div>

<div class="workspace">

<div class="editors">

<div class="panel">
<h3>🧱 index.html</h3>

<textarea id="htmlCode"><h1>Hello WebCode</h1>
<p>Start building something amazing.</p></textarea>

</div>

<div class="panel">
<h3>🎨 style.css</h3>

<textarea id="cssCode">body{
font-family:Arial,sans-serif;
padding:20px;
}

h1{
color:dodgerblue;
}</textarea>

</div>

<div class="panel">
<h3>⚡ script.js</h3>

<textarea id="jsCode">document.body.style.transition="all .3s";</textarea>

</div>

</div>

<div class="panel preview-panel">

<h3>👀 Live Preview</h3>

<iframe
id="preview"
sandbox="allow-scripts allow-modals allow-forms allow-popups">
</iframe>

<div
id="stats"
class="stats">
</div>

<h3 style="margin-top:15px;">🕒 Version History</h3>

<div
id="history"
class="history">
</div>

<button id="clearHistoryBtn">
🗑 Clear History
</button>

</div>

</div>

<script>

const htmlCode = document.getElementById("htmlCode");
const cssCode = document.getElementById("cssCode");
const jsCode = document.getElementById("jsCode");
const preview = document.getElementById("preview");
const projectName = document.getElementById("projectName");

window.addEventListener("load", () => {

    if (typeof JSZip === "undefined") {

        alert(
            "JSZip NOT loaded.\n\nMake sure jszip.min.js is beside index.html"
        );

    } else {

        console.log("JSZip loaded successfully");

    }
});

function countLines(text){
    return text.split("\n").length;
}

function updateStats(){
    document.getElementById("stats").innerHTML = `
        HTML: ${htmlCode.value.length} chars | ${countLines(htmlCode.value)} lines
        <br>
        CSS: ${cssCode.value.length} chars | ${countLines(cssCode.value)} lines
        <br>
        JS: ${jsCode.value.length} chars | ${countLines(jsCode.value)} lines
    `;
}

function runCode(){

    const html = htmlCode.value;
    const css = cssCode.value;

    const js = jsCode.value.replace(
        /<\/script>/gi,
        "<\\/script>"
    );

    preview.srcdoc = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>${css}</style>
</head>
<body>

${html}

<script>

try{

${js}

}catch(error){

    const pre =
        document.createElement("pre");

    pre.style.color = "red";
    pre.style.padding = "10px";
    pre.style.border = "1px solid red";
    pre.style.background = "#fff5f5";

    pre.textContent =
        error.stack || error;

    document.body.appendChild(pre);
}

<\/script>

</body>
</html>
`;

    updateStats();
}

function saveDraft(){

    localStorage.setItem(
        "draft-html",
        htmlCode.value
    );

    localStorage.setItem(
        "draft-css",
        cssCode.value
    );

    localStorage.setItem(
        "draft-js",
        jsCode.value
    );

    localStorage.setItem(
        "draft-name",
        projectName.value
    );

    const status =
        document.getElementById(
            "saveStatus"
        );

    status.textContent =
        "Draft Saved";

    clearTimeout(
        saveDraft._timer
    );

    saveDraft._timer =
        setTimeout(()=>{
            status.textContent="";
        },2000);
}a

function restoreDraft(){

    htmlCode.value =
        localStorage.getItem("draft-html")
        || htmlCode.value;

    cssCode.value =
        localStorage.getItem("draft-css")
        || cssCode.value;

    jsCode.value =
        localStorage.getItem("draft-js")
        || jsCode.value;

    projectName.value =
        localStorage.getItem("draft-name")
        || projectName.value;

}

let autoSaveTimer;

function autoRun(){

    clearTimeout(autoSaveTimer);

    autoSaveTimer =
        setTimeout(()=>{

            saveDraft();

            if(
                document.getElementById(
                    "autorun"
                ).checked
            ){
                runCode();
            }

        },300);
}

htmlCode.addEventListener("input", autoRun);
cssCode.addEventListener("input", autoRun);
jsCode.addEventListener("input", autoRun);

function getDB(){

    try{

        return JSON.parse(
            localStorage.getItem("webcode-db")
        ) || {history:[]};

    }catch{

        return {history:[]};

    }

}

function saveProject(){

    const db = getDB();

    const project = {

        name: projectName.value,
        html: htmlCode.value,
        css: cssCode.value,
        js: jsCode.value,
        timestamp:
            new Date()
            .toLocaleString()
    };

    const last =
        db.history[
            db.history.length - 1
        ];

    if(
        !last ||
        last.html !== project.html ||
        last.css !== project.css ||
        last.js !== project.js
    ){
        db.history.push(project);
    }

    if(db.history.length > 50){
        db.history.shift();
    }

    localStorage.setItem(
        "webcode-db",
        JSON.stringify(db)
    );

    loadHistory();

    alert("Project Saved");
}

function loadHistory(){

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    const db = getDB();

    [...db.history]
    .reverse()
    .forEach(item=>{

        const btn =
            document.createElement("button");

        btn.textContent =
            item.timestamp;

        btn.onclick = () => {

            projectName.value =
                item.name;

            htmlCode.value =
                item.html;

            cssCode.value =
                item.css;

            jsCode.value =
                item.js;

            runCode();

        };

        history.appendChild(btn);

    });

}

function clearHistory(){

    if(
        !confirm(
            "Delete all saved versions?"
        )
    ){
        return;
    }

    localStorage.removeItem(
        "webcode-db"
    );

    loadHistory();
}

async function exportProject(){

    try{

        if(typeof JSZip === "undefined"){

            alert("JSZip not loaded");
            return;

        }

        const zip =
            new JSZip();

        const completeHTML =
`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${projectName.value}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

${htmlCode.value}

<script src="script.js"><\/script>

</body>
</html>`;

        zip.file(
            "index.html",
            completeHTML
        );

        zip.file(
            "style.css",
            cssCode.value
        );

        zip.file(
            "script.js",
            jsCode.value
        );

        const blob =
            await zip.generateAsync({
                type:"blob"
            });

        const url =
            URL.createObjectURL(blob);

        const safeName =
(projectName.value || "project")
.replace(
    /[^a-z0-9_\- ]/gi,
    "_"
);

a.download =
safeName + ".zip";

        document.body.appendChild(a);
        a.click();

        a.remove();

        setTimeout(()=>{

            URL.revokeObjectURL(url);

        },100);

    }catch(error){

        alert(
            "Export failed: " +
            error.message
        );

        console.error(error);

    }

}

function importFiles(){

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";

    input.multiple = true;

    input.accept =
        ".html,.css,.js";

    input.onchange =
    async ()=>{

        const files =
            [...input.files];

        for(
            const file of files
        ){

            const content =
                await file.text();

            const name =
                file.name
                .toLowerCase();

            if(
                name.endsWith(
                    ".html"
                )
            ){
                htmlCode.value =
                    content;
            }

            else if(
                name.endsWith(
                    ".css"
                )
            ){
                cssCode.value =
                    content;
            }

            else if(
                name.endsWith(
                    ".js"
                )
            ){
                jsCode.value =
                    content;
            }
        }

        runCode();
    };

    input.click();
}

const themeBtn =
    document.getElementById(
        "themeBtn"
    );

function updateThemeButton(){

    themeBtn.textContent =
        document.body.classList.contains(
            "light"
        )
        ? "☀ Dark"
        : "🌙 Light";
}

function toggleTheme(){

    document.body.classList.toggle(
        "light"
    );

    localStorage.setItem(
        "theme",
        document.body.classList.contains(
            "light"
        )
    );

    updateThemeButton();
}

function fullscreenPreview(){

    if(preview.requestFullscreen){

        preview.requestFullscreen();

    }else if(
        preview.webkitRequestFullscreen
    ){

        preview.webkitRequestFullscreen();

    }

}

document.addEventListener(
"keydown",
function(e){

    if(e.ctrlKey && e.key === "s"){

        e.preventDefault();
        saveProject();

    }

    if(e.ctrlKey && e.key === "Enter"){

        e.preventDefault();
        runCode();

    }

    if(
        e.ctrlKey &&
        e.key.toLowerCase() === "l"
    ){

        e.preventDefault();

        htmlCode.value = "";
        cssCode.value = "";
        jsCode.value = "";

        runCode();

    }

});

if(
    localStorage.getItem(
        "theme"
    ) === "true"
){
    document.body.classList.add(
        "light"
    );
}

updateThemeButton();
restoreDraft();
loadHistory();
updateStats();
runCode();

</script>

</body>
</html>
